server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve upstream hostnames at request time (Docker's embedded DNS)
    # rather than at nginx startup, so this container still starts cleanly
    # even when run standalone (e.g. `docker run` outside docker-compose)
    # where "backend" won't resolve.
    resolver 127.0.0.11 valid=10s;

    # Only exercised by `docker compose up` local development, where this
    # container and the backend share a Docker network and there's no ALB
    # in front doing path-based routing. In the real AWS deployment the ALB
    # routes /api/* straight to the backend ECS target group and this block
    # is never hit — it exists so local dev mirrors production paths
    # (frontend always calls relative /api, never a hardcoded host).
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
